plugins {
    id "java"
    id "idea"
    id "ivy-publish"
    id "jacoco"
    id "java-library"
    id "signing"
    id "maven-publish"
    id "com.vanniktech.maven.publish" version "0.30.0"
}

def graphqlCodegenVersion = '5.10.1-SNAPSHOT' // This variable used in the automatic release process

group = "io.github.besi97"
version = graphqlCodegenVersion

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.freemarker:freemarker:2.3.32"
    compileOnly "com.graphql-java:graphql-java:20.2"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:2.15.3"
    compileOnly "com.typesafe:config:1.4.3"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testImplementation "org.hamcrest:java-hamcrest:2.0.0.0"
}

test.useJUnitPlatform()

task codeCoverageReport(type: JacocoReport) {
    executionData fileTree(project.rootDir.absolutePath).include("build/jacoco/*.exec")

    sourceSets sourceSets.main

    reports {
        html.required = false
        csv.required = false
        xml.destination = file("${buildDir}/reports/jacoco/report.xml")
    }
}

configurations {
    testImplementation.extendsFrom compileOnly
}

test {
    testLogging {
        events "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }
}

codeCoverageReport.dependsOn test

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"
javadoc.options.encoding = "UTF-8"

mavenPublishing {
    publishToMavenCentral("CENTRAL_PORTAL")
    signAllPublications()

    coordinates("io.github.besi97", "graphql-java-codegen", graphqlCodegenVersion)

    pom {
        name = "GraphQL Java CodeGen"
        description = "Java Code Generator based on GraphQL schema"
        url = "https://github.com/Besi97/graphql-java-codegen"
        organization {
            name = "io.github.besi97"
            url = "https://github.com/Besi97"
        }
        issueManagement {
            system = "GitHub"
            url = "https://github.com/Besi97/graphql-java-codegen/issues"
        }
        licenses {
            license {
                name = "MIT License"
                url = "https://github.com/Besi97/graphql-java-codegen/blob/main/LICENSE"
                distribution = "repo"
            }
        }
        scm {
            url = "https://github.com/Besi97/graphql-java-codegen"
            connection = "scm:git:git://github.com/Besi97/graphql-java-codegen.git"
            developerConnection = "scm:git:ssh://git@github.com:Besi97/graphql-java-codegen.git"
        }
        developers {
            developer {
                id = "Besi97"
                name = "Dávid Besenyei"
            }
        }
    }
}

publishing {
    publications {
        ivy(IvyPublication) {
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    repositories {
        ivy {
            url "${System.properties['user.home']}/.ivy2/local"
            patternLayout {
                artifact '[organisation]/[module]/[revision]/[ext]s/[artifact](-[classifier])(.[ext])'
                // for ci and local, must publish to ivy2 local
                ivy '[organisation]/[module]/[revision]/[type]s/[artifact](.[ext])'
            }
        }
    }
}
