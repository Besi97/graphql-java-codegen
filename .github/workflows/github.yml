name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk-version: [ 8, 11, 17, 21 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (for Gradle daemon)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Java ${{ matrix.jdk-version }} (for compilation)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk-version }}
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle

      - name: Build library
        run: ./gradlew build publishToMavenLocal --warning-mode all -Porg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Build gradle plugin
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin build publishToMavenLocal --warning-mode all -Porg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Build gradle example-server
        run: ./gradlew -p plugins/gradle/example-server test --warning-mode all -Porg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Build gradle example-client
        run: ./gradlew -p plugins/gradle/example-client test --warning-mode all -Porg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Build gradle example-client-kotlin
        run: ./gradlew -p plugins/gradle/example-client-kotlin build --warning-mode all -Porg.gradle.java.home=$JAVA_HOME_17_X64

