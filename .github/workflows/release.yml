name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY_PEM }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Configure Git
        run: |
          git config --global user.name 'graphql-java-codegen-ci-bot[bot]'
          git config --global user.email 'graphql-java-codegen-ci-bot[bot]@users.noreply.github.com'

      - name: Update versions in build files
        run: scripts/update-release-version-in-build-files.sh ${{ steps.version.outputs.version }}

      - name: Update versions in README files
        run: scripts/update-release-version-in-readme.sh ${{ steps.version.outputs.version }}

      - name: Build library
        run: ./gradlew build publishToMavenLocal --warning-mode all
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Build gradle plugin
        run: ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin build publishToMavenLocal --warning-mode all

      - name: Build gradle example-server
        run: ./gradlew -p plugins/gradle/example-server test --warning-mode all

      - name: Build gradle example-client
        run: ./gradlew -p plugins/gradle/example-client test --warning-mode all

      - name: Build gradle example-client-kotlin
        run: ./gradlew -p plugins/gradle/example-client-kotlin build --warning-mode all

      - name: Commit release version
        run: git commit -am "Release ${{ github.event.release.tag_name }}"

      - name: Release library to Maven Central
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Release Gradle plugin
        run: |
          ./gradlew -p plugins/gradle/graphql-java-codegen-gradle-plugin publishPlugins \
              -Dorg.gradle.internal.publish.checksums.insecure=true \
              -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} \
              -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Push release version
        run: git push

      - name: Bump to next SNAPSHOT version
        run: scripts/bump-to-next-snapshot-version.sh

      - name: Commit and push SNAPSHOT bump
        run: |
          git commit -am "Bump to next development version"
          git push
